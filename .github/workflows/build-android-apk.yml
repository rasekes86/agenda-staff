name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-android'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build signed universal APK
        working-directory: android-editor
        run: gradle assembleRelease
      - name: Name APK
        run: cp android-editor/app/build/outputs/apk/release/app-release.apk agenda-staff-pdf-v3.0.3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: agenda-staff-pdf-v3.0.3
          path: agenda-staff-pdf-v3.0.3.apk
          if-no-files-found: error
